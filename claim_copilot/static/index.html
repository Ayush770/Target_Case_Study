<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freight Claim Copilot</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">FC</div>
      <div>
        <div class="brand-name">Claim Copilot</div>
        <div class="brand-sub">Northstar Retail Equipment</div>
      </div>
    </div>

    <div class="sidebar-claim-card">
      <div class="claim-id-label">Active Claim</div>
      <div class="claim-id" id="claim-title">FCL-2026-0147</div>
      <div class="claim-meta" id="claim-meta"></div>
      <div class="claim-status-pill" id="claim-status">Loading…</div>
    </div>

    <nav class="sidebar-nav" aria-label="Claim workspace">
      <button class="nav-item" data-view="upload">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Documents
      </button>
      <button class="nav-item active" data-view="overview">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Overview
      </button>
      <button class="nav-item" data-view="evidence">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Evidence &amp; Findings
      </button>
      <button class="nav-item" data-view="position">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Contract Position
      </button>
      <button class="nav-item" data-view="history">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Similar Claims
      </button>
      <button class="nav-item" data-view="draft">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Negotiation Draft
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="posture-label">Decision posture</div>
      <div class="posture-value">Human review required</div>
      <div class="posture-sub">Facts, rules, and recommendations remain separate.</div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="page-title">Overview</h1>
        <p class="page-sub" id="page-sub">Claim metrics, open findings, and operational timeline</p>
      </div>
      <div class="topbar-right">
        <a href="/docs" target="_blank" rel="noreferrer" class="api-link">API Docs</a>
        <div class="health-dot" id="health-dot" title="Health"></div>
      </div>
    </header>

    <section id="content" aria-live="polite">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading source-linked claim data…</p>
      </div>
    </section>
  </main>

</div>

<template id="empty">
  <div class="loading-state">
    <div class="spinner"></div>
    <p>Loading source-linked claim data…</p>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
